name: Deploy workbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Test storage and application logic
        run: node --test tests/storage.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
